site_name: Conductor 中文文档
site_description: Conductor 是一个开源的持久化代码执行引擎与智能体工作流引擎，采用 Saga 补偿模式编排分布式工作流，支持 Java、Python、Go 等多语言 worker。本文档为官方英文文档的简体中文翻译版。
repo_url: https://github.com/conductor-oss/conductor
site_url: https://noexcs.github.io/conductor-zh/
edit_uri: ''
strict: false
use_directory_urls: false
docs_dir: docs-zh
site_dir: site-zh
exclude_docs: |
  index.html
not_in_nav: |
  devguide/architecture/directed-acyclic-graph.md
  devguide/cookbook/files-api-usecase.md
